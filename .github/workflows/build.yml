name: Build APK

# Compila o APK automaticamente na nuvem, sem precisar de Buildozer local.
# Dispara a cada push, ou manualmente na aba "Actions" do repositorio.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Compilar APK (debug)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-home-apk
          path: ${{ steps.buildozer.outputs.filename }}
